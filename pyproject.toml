[project]
name = "automatic-cvrm-classifier"
version = "0.1.0"
description = "Automatic Cardiovascular Risk Management (CVRM) classification using Electronic Health Records (EHR)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "UPOD Data Science" }
]
dependencies = [
    "torch>=2.2.0",
    "torchmetrics>=1.3.0",
    "transformers>=4.38.0",
    "tokenizers>=0.15.0",
    "einops>=0.7.0",
    "rotary-embedding-torch>=0.5.0",
    "scikit-learn>=1.4.0",
    "imbalanced-learn>=0.12.0",
    "pandas>=2.1.0",
    "pyarrow>=14.0.0",
    "joblib>=1.3.0",
    "seaborn>=0.13.0",
    "matplotlib>=3.8.0",
    "tensorboard>=2.15.0",
]
